<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💩 Poop Survivor - 똥 피하기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }

  #gameWrapper {
    position: relative;
    border: 4px solid #e94560;
    border-radius: 12px;
    box-shadow:
      0 0 30px rgba(233, 69, 96, 0.3),
      0 0 60px rgba(233, 69, 96, 0.1),
      inset 0 0 30px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  canvas {
    display: block;
    background: #16213e;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(22, 33, 62, 0.92);
    z-index: 10;
    transition: opacity 0.3s;
  }

  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #overlay h1 {
    color: #e94560;
    font-size: 22px;
    text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
    margin-bottom: 8px;
    letter-spacing: 1px;
    padding: 0 20px;
  }

  #overlay .poop-title {
    font-size: 48px;
    margin-bottom: 20px;
    animation: bounce 1s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  #overlay .subtitle {
    color: #a8a8b3;
    font-size: 10px;
    margin-bottom: 30px;
    line-height: 1.8;
    text-align: center;
  }

  #startBtn, #restartBtn {
    background: #e94560;
    color: #fff;
    border: none;
    padding: 14px 36px;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
    box-shadow: 0 4px 0 #b8344d, 0 6px 20px rgba(233, 69, 96, 0.3);
  }

  #startBtn:hover, #restartBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #b8344d, 0 8px 25px rgba(233, 69, 96, 0.4);
  }

  #startBtn:active, #restartBtn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #b8344d;
  }

  #gameOverText {
    color: #e94560;
    font-size: 24px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
  }

  #finalScore {
    color: #eee;
    font-size: 14px;
    margin-bottom: 8px;
  }

  #highScoreText {
    color: #f5a623;
    font-size: 11px;
    margin-bottom: 24px;
  }

  .controls-hint {
    color: #777;
    font-size: 11px;
    margin-top: 16px;
    text-align: center;
    line-height: 2.2;
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="overlay">
    <div class="poop-title">💩</div>
    <h1>Poop Survivor</h1>
    <div class="subtitle">
      똥을 피하고 살아남아라!
    </div>
    <button id="startBtn">START</button>
    <div class="controls-hint">
      ← → 방향키 또는 터치로 이동<br>
      ↑ 또는 스페이스바로 점프
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;

let game = null;
let highScore = 0;
let animFrameId = null;

// ============================================================
// STAGE CONFIG — 5 stages
// ============================================================
const STAGES = [
  { // Stage 1
    name: 'STAGE 1', color: '#4aa3df',
    spawnInterval: 28, baseSpeed: 3.8, speedVariance: 2.0,
    doubleChance: 0.30, tripleChance: 0, swayChance: 0.15,
    shieldDrop: false, shieldDropInterval: 9999, freeShields: 0,
    scoreThreshold: 0,
  },
  { // Stage 2
    name: 'STAGE 2', color: '#2ecc71',
    spawnInterval: 24, baseSpeed: 4.5, speedVariance: 2.5,
    doubleChance: 0.40, tripleChance: 0.10, swayChance: 0.25,
    shieldDrop: true, shieldDropInterval: 550, freeShields: 1,
    scoreThreshold: 50,
  },
  { // Stage 3
    name: 'STAGE 3', color: '#f5a623',
    spawnInterval: 20, baseSpeed: 5.2, speedVariance: 3.0,
    doubleChance: 0.50, tripleChance: 0.20, swayChance: 0.35,
    shieldDrop: true, shieldDropInterval: 480, freeShields: 1,
    scoreThreshold: 150,
  },
  { // Stage 4
    name: 'STAGE 4', color: '#e94560',
    spawnInterval: 16, baseSpeed: 6.0, speedVariance: 3.5,
    doubleChance: 0.55, tripleChance: 0.30, swayChance: 0.45,
    shieldDrop: true, shieldDropInterval: 420, freeShields: 1,
    scoreThreshold: 300,
  },
  { // Stage 5
    name: 'STAGE 5', color: '#9b59b6',
    spawnInterval: 12, baseSpeed: 7.0, speedVariance: 4.0,
    doubleChance: 0.60, tripleChance: 0.40, swayChance: 0.55,
    shieldDrop: true, shieldDropInterval: 380, freeShields: 1,
    scoreThreshold: 500,
  },
];

// ============================================================
// Player
// ============================================================
class Player {
  constructor() {
    this.x = W / 2; this.y = H - 60;
    this.vx = 0; this.vy = 0;
    this.speed = 5; this.onGround = true;
    this.jumpPower = -11; this.gravity = 0.55;
    this.groundY = H - 60; this.facing = 1;
    this.walkFrame = 0; this.walkTimer = 0;
    this.isHit = false; this.hitTimer = 0;
  }

  update(keys) {
    let moving = false;
    if (keys.left) { this.vx = -this.speed; this.facing = -1; moving = true; }
    else if (keys.right) { this.vx = this.speed; this.facing = 1; moving = true; }
    else { this.vx = 0; }

    if (moving && this.onGround) {
      this.walkTimer++;
      if (this.walkTimer > 6) { this.walkTimer = 0; this.walkFrame = (this.walkFrame + 1) % 4; }
    } else { this.walkFrame = 0; this.walkTimer = 0; }

    if (keys.up && this.onGround) { this.vy = this.jumpPower; this.onGround = false; }

    this.vy += this.gravity; this.y += this.vy; this.x += this.vx;
    if (this.y >= this.groundY) { this.y = this.groundY; this.vy = 0; this.onGround = true; }
    if (this.x < 14) this.x = 14;
    if (this.x > W - 14) this.x = W - 14;
    if (this.isHit) { this.hitTimer--; if (this.hitTimer <= 0) this.isHit = false; }
  }

  draw(ctx, hasShield, time) {
    if (this.isHit && Math.floor(this.hitTimer / 3) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    const legOff = [0, 4, 0, -4][this.walkFrame];
    const armOff = [0, -3, 0, 3][this.walkFrame];

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 22, 14, 4, 0, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(-6 + legOff, 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(6 - legOff, 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-10 + armOff, 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(10 - armOff, 4); ctx.stroke();

    ctx.fillStyle = '#e0e0e0';
    ctx.beginPath(); ctx.arc(0, -14, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#16213e';
    ctx.beginPath();
    ctx.arc(this.facing * 2 - 2, -15, 1.5, 0, Math.PI * 2);
    ctx.arc(this.facing * 2 + 3, -15, 1.5, 0, Math.PI * 2);
    ctx.fill();

    if (hasShield) {
      const pulse = 0.4 + Math.sin((time || 0) * 0.08) * 0.15;
      ctx.strokeStyle = `rgba(74, 163, 255, ${pulse})`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(0, 2, 24, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  getBounds() { return { x: this.x - 10, y: this.y - 22, w: 20, h: 42 }; }
}

// ============================================================
// Poop
// ============================================================
class Poop {
  constructor(speed, sway) {
    this.size = 20 + Math.random() * 16;
    this.x = Math.random() * (W - 40) + 20;
    this.y = -this.size;
    this.speed = speed + Math.random() * 2.5;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.08;
    this.sway = sway ? true : false;
    this.swayBase = this.x;
    this.swayAngle = Math.random() * Math.PI * 2;
  }
  update() {
    this.y += this.speed;
    this.rotation += this.rotSpeed;
    if (this.sway) { this.swayAngle += 0.04; this.x = this.swayBase + Math.sin(this.swayAngle) * 40; }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
    const s = this.size;
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(2, s*0.35, s*0.45, s*0.15, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8B6914';
    ctx.beginPath(); ctx.ellipse(0, s*0.18, s*0.4, s*0.2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#9B7424';
    ctx.beginPath(); ctx.ellipse(0, -s*0.02, s*0.3, s*0.17, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#A88030';
    ctx.beginPath(); ctx.ellipse(0, -s*0.2, s*0.18, s*0.13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -s*0.33, s*0.08, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-s*0.12, -s*0.05, s*0.07, 0, Math.PI*2); ctx.arc(s*0.12, -s*0.05, s*0.07, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-s*0.10, -s*0.04, s*0.035, 0, Math.PI*2); ctx.arc(s*0.14, -s*0.04, s*0.035, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  getBounds() { return { x: this.x - this.size*0.35, y: this.y - this.size*0.3, w: this.size*0.7, h: this.size*0.55 }; }
  isOffScreen() { return this.y > H + 30; }
}

// ============================================================
// Shield Item
// ============================================================
class ShieldItem {
  constructor() {
    this.x = Math.random() * (W - 60) + 30;
    this.y = -20;
    this.speed = 2 + Math.random();
    this.size = 16;
    this.bobAngle = Math.random() * Math.PI * 2;
    this.glow = 0;
  }
  update() { this.y += this.speed; this.bobAngle += 0.06; this.glow++; }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y + Math.sin(this.bobAngle) * 4);
    const s = this.size;
    const ga = 0.3 + Math.sin(this.glow * 0.1) * 0.2;
    ctx.fillStyle = `rgba(74,163,255,${ga})`;
    ctx.beginPath(); ctx.arc(0, 0, s + 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4aa3df';
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2980b9';
    ctx.beginPath(); ctx.arc(0, 0, s - 4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#4aa3df'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -s*0.5); ctx.lineTo(0, s*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.5, 0); ctx.lineTo(s*0.5, 0); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(-s*0.25, -s*0.25, s*0.25, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  getBounds() { return { x: this.x - this.size, y: this.y - this.size, w: this.size*2, h: this.size*2 }; }
  isOffScreen() { return this.y > H + 30; }
}

// ============================================================
// Particle
// ============================================================
class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*6; this.vy = -Math.random()*5-2;
    this.life = 30 + Math.random()*20; this.maxLife = this.life;
    this.size = 3 + Math.random()*4;
    this.color = color || ['#8B6914','#9B7424','#A88030','#6B5010'][Math.floor(Math.random()*4)];
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += 0.2; this.life--; }
  draw(ctx) {
    ctx.globalAlpha = this.life/this.maxLife;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size*(this.life/this.maxLife), 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// Star
// ============================================================
class Star {
  constructor() {
    this.x = Math.random()*W; this.y = Math.random()*H;
    this.size = Math.random()*1.5+0.5;
    this.blinkSpeed = Math.random()*0.03+0.01;
    this.blinkOffset = Math.random()*Math.PI*2;
  }
  draw(ctx, time) {
    ctx.fillStyle = `rgba(255,255,255,${0.3+Math.sin(time*this.blinkSpeed+this.blinkOffset)*0.25})`;
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

// ============================================================
// Game
// ============================================================
class Game {
  constructor() {
    this.player = new Player();
    this.poops = [];
    this.shieldItems = [];
    this.particles = [];
    this.stars = Array.from({length:50}, ()=>new Star());
    this.score = 0;
    this.lives = 3;
    this.shields = 0;
    this.maxShields = 3;
    this.time = 0;
    this.spawnTimer = 0;
    this.shieldSpawnTimer = 0;
    this.stage = 0;
    this.gameOver = false;
    this.dodged = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.shakeTimer = 0;
    this.shakeIntensity = 0;
    this.keys = {left:false, right:false, up:false};
    this.comboText = '';
    this.comboTextTimer = 0;
    this.stageText = STAGES[0].name;
    this.stageTextTimer = 90;
    this.shieldText = '';
    this.shieldTextTimer = 0;
  }

  cfg() { return STAGES[this.stage]; }

  update() {
    if (this.gameOver) return;
    this.time++;
    this.score = Math.floor(this.time / 6);

    // Stage check
    let ns = 0;
    for (let i = STAGES.length-1; i >= 0; i--) {
      if (this.score >= STAGES[i].scoreThreshold) { ns = i; break; }
    }
    if (ns !== this.stage) {
      this.stage = ns;
      const c = this.cfg();
      this.stageText = c.name;
      this.stageTextTimer = 90;
      // Free shield on stage 2+
      if (this.stage >= 1 && c.freeShields > 0 && this.shields < this.maxShields) {
        this.shields = Math.min(this.maxShields, this.shields + c.freeShields);
        this.shieldText = `방패 지급! (${this.shields}/${this.maxShields})`;
        this.shieldTextTimer = 70;
      }
    }

    const c = this.cfg();

    // Spawn poops
    this.spawnTimer++;
    if (this.spawnTimer >= c.spawnInterval) {
      this.spawnTimer = 0;
      this.poops.push(new Poop(c.baseSpeed, Math.random() < c.swayChance));
      if (Math.random() < c.doubleChance)
        this.poops.push(new Poop(c.baseSpeed + 0.5 + Math.random()*c.speedVariance*0.3, Math.random() < c.swayChance));
      if (Math.random() < c.tripleChance)
        this.poops.push(new Poop(c.baseSpeed + 1.0 + Math.random()*c.speedVariance*0.5, Math.random() < c.swayChance*1.2));
    }

    // Spawn shield items (stage 2+)
    if (c.shieldDrop) {
      this.shieldSpawnTimer++;
      if (this.shieldSpawnTimer >= c.shieldDropInterval) {
        this.shieldSpawnTimer = 0;
        if (this.shields < this.maxShields) this.shieldItems.push(new ShieldItem());
      }
    }

    this.player.update(this.keys);

    // Shield items
    for (let i = this.shieldItems.length-1; i >= 0; i--) {
      const si = this.shieldItems[i];
      si.update();
      if (si.isOffScreen()) { this.shieldItems.splice(i,1); continue; }
      if (this.checkCol(this.player.getBounds(), si.getBounds())) {
        if (this.shields < this.maxShields) {
          this.shields++;
          this.shieldText = `방패 획득! (${this.shields}/${this.maxShields})`;
          this.shieldTextTimer = 70;
          for (let j=0;j<8;j++) this.particles.push(new Particle(si.x, si.y, ['#4aa3df','#2980b9','#74b9ff','#a3d8f4'][Math.floor(Math.random()*4)]));
        }
        this.shieldItems.splice(i,1);
      }
    }

    // Poops
    for (let i = this.poops.length-1; i >= 0; i--) {
      const p = this.poops[i];
      p.update();
      if (p.isOffScreen()) {
        this.poops.splice(i,1);
        this.dodged++; this.combo++;
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
        if (this.combo % 10 === 0 && this.combo > 0) {
          this.comboText = `${this.combo} COMBO!`;
          this.comboTextTimer = 60;
        }
        continue;
      }
      if (!this.player.isHit && this.checkCol(this.player.getBounds(), p.getBounds())) {
        this.combo = 0;
        this.player.isHit = true;
        this.player.hitTimer = 40;
        this.shakeTimer = 12;
        this.shakeIntensity = 6;
        for (let j=0;j<12;j++) this.particles.push(new Particle(p.x, p.y));
        this.poops.splice(i,1);

        if (this.shields > 0) {
          this.shields--;
          this.shieldText = `방패 사용! (${this.shields}/${this.maxShields})`;
          this.shieldTextTimer = 70;
        } else {
          this.lives--;
          if (this.lives <= 0) {
            this.gameOver = true;
            if (this.score > highScore) highScore = this.score;
            setTimeout(()=>showGameOver(this.stage+1), 500);
          }
        }
      }
    }

    for (let i = this.particles.length-1; i >= 0; i--) {
      this.particles[i].update();
      if (this.particles[i].life <= 0) this.particles.splice(i,1);
    }
    if (this.shakeTimer > 0) this.shakeTimer--;
    if (this.comboTextTimer > 0) this.comboTextTimer--;
    if (this.stageTextTimer > 0) this.stageTextTimer--;
    if (this.shieldTextTimer > 0) this.shieldTextTimer--;
  }

  checkCol(a, b) { return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

  draw() {
    ctx.save();
    if (this.shakeTimer > 0) {
      const s = this.shakeIntensity*(this.shakeTimer/12);
      ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }

    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#0f1123'); grad.addColorStop(1,'#16213e');
    ctx.fillStyle = grad; ctx.fillRect(-10,-10,W+20,H+20);
    this.stars.forEach(s=>s.draw(ctx,this.time));

    ctx.fillStyle = '#1a2744'; ctx.fillRect(0,H-35,W,35);
    ctx.strokeStyle = '#2a3f6a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,H-35); ctx.lineTo(W,H-35); ctx.stroke();
    ctx.fillStyle = '#2a3f6a';
    for (let i=0;i<W;i+=20) ctx.fillRect(i+((this.time*0.5)%20),H-28,2,2);

    this.shieldItems.forEach(si=>si.draw(ctx));
    this.poops.forEach(p=>p.draw(ctx));
    this.particles.forEach(p=>p.draw(ctx));
    this.player.draw(ctx, this.shields > 0, this.time);
    this.drawHUD();
    ctx.restore();
  }

  drawHUD() {
    const c = this.cfg();

    // Score
    ctx.fillStyle = '#e94560';
    ctx.font = '12px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE', 12, 24);
    ctx.fillStyle = '#fff';
    ctx.font = '18px "Press Start 2P", monospace';
    ctx.fillText(`${this.score}`, 12, 46);

    // Stage (top center)
    ctx.textAlign = 'center';
    ctx.fillStyle = c.color;
    ctx.font = '9px "Press Start 2P", monospace';
    ctx.fillText(c.name, W/2, 20);

    // Hearts
    for (let i=0;i<3;i++) {
      this.drawHeart(ctx, W-22-i*26, 12, 8, i<this.lives?'#e94560':'#333');
    }

    // Shield icons
    for (let i=0;i<this.maxShields;i++) {
      this.drawShieldIcon(ctx, W-20-i*22, 38, 7, i<this.shields?'#4aa3df':'#333');
    }

    // Combo
    if (this.comboTextTimer > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, this.comboTextTimer/20);
      ctx.textAlign = 'center';
      ctx.font = `${14*(1+(1-this.comboTextTimer/60)*0.3)}px "Press Start 2P", monospace`;
      ctx.fillStyle = '#f5a623';
      ctx.fillText(this.comboText, W/2, H/2-60);
      ctx.restore();
    }

    // Stage banner
    if (this.stageTextTimer > 0) {
      const a = this.stageTextTimer>70?(90-this.stageTextTimer)/20:this.stageTextTimer<20?this.stageTextTimer/20:1;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.font = '22px "Press Start 2P", monospace';
      ctx.fillStyle = c.color;
      ctx.fillText(this.stageText, W/2, H/2-20);
      if (this.stage >= 1) {
        ctx.font = '9px "Press Start 2P", monospace';
        ctx.fillStyle = '#4aa3df';
        ctx.fillText('방패 시스템 활성화!', W/2, H/2+10);
      }
      ctx.restore();
    }

    // Shield text
    if (this.shieldTextTimer > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, this.shieldTextTimer/15);
      ctx.textAlign = 'center';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillStyle = '#4aa3df';
      ctx.fillText(this.shieldText, W/2, H/2+40);
      ctx.restore();
    }
  }

  drawHeart(ctx, x, y, s, color) {
    ctx.save(); ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(x, y+s*0.3);
    ctx.bezierCurveTo(x, y-s*0.3, x-s, y-s*0.3, x-s, y+s*0.1);
    ctx.bezierCurveTo(x-s, y+s*0.6, x, y+s, x, y+s*1.2);
    ctx.bezierCurveTo(x, y+s, x+s, y+s*0.6, x+s, y+s*0.1);
    ctx.bezierCurveTo(x+s, y-s*0.3, x, y-s*0.3, x, y+s*0.3);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  drawShieldIcon(ctx, x, y, s, color) {
    ctx.save(); ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(x, y-s);
    ctx.lineTo(x-s*0.8, y-s*0.5);
    ctx.lineTo(x-s*0.8, y+s*0.2);
    ctx.quadraticCurveTo(x, y+s, x, y+s);
    ctx.quadraticCurveTo(x, y+s, x+s*0.8, y+s*0.2);
    ctx.lineTo(x+s*0.8, y-s*0.5);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
}

// ============================================================
// Input
// ============================================================
document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
  if (game && !game.gameOver) {
    if (e.code==='ArrowLeft'||e.code==='KeyA') game.keys.left=true;
    if (e.code==='ArrowRight'||e.code==='KeyD') game.keys.right=true;
    if (e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') game.keys.up=true;
  }
});
document.addEventListener('keyup', e => {
  if (game) {
    if (e.code==='ArrowLeft'||e.code==='KeyA') game.keys.left=false;
    if (e.code==='ArrowRight'||e.code==='KeyD') game.keys.right=false;
    if (e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') game.keys.up=false;
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t=e.touches[0], r=canvas.getBoundingClientRect();
  const tx=t.clientX-r.left, ty=t.clientY-r.top;
  if (game&&!game.gameOver) {
    if (ty<r.height*0.5) game.keys.up=true;
    if (tx<r.width/2) {game.keys.left=true;game.keys.right=false;}
    else {game.keys.right=true;game.keys.left=false;}
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (game) {game.keys.left=false;game.keys.right=false;game.keys.up=false;}
}, {passive:false});

// ============================================================
// Game Loop
// ============================================================
function gameLoop() {
  if (!game) return;
  game.update(); game.draw();
  animFrameId = requestAnimationFrame(gameLoop);
}

function startGame() {
  overlay.classList.add('hidden');
  game = new Game();
  if (animFrameId) cancelAnimationFrame(animFrameId);
  gameLoop();
}

function showGameOver(reachedStage) {
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="poop-title">💀</div>
    <div id="gameOverText">GAME OVER</div>
    <div id="finalScore">SCORE: ${game.score}</div>
    <div style="color:#aaa;font-size:10px;margin-bottom:6px;font-family:'Press Start 2P',monospace;">STAGE ${reachedStage} 도달</div>
    <div id="highScoreText">🏆 BEST: ${highScore}</div>
    <button id="restartBtn" onclick="startGame()">RETRY</button>
    <div class="controls-hint">
      ← → 방향키 또는 터치로 이동<br>
      ↑ 또는 스페이스바로 점프
    </div>
  `;
}

startBtn.addEventListener('click', startGame);
</script>
