<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💩 Poop Survivor - 똥 피하기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1a2e; display:flex; justify-content:center;
    align-items:center; min-height:100vh; width:100%;
    font-family:'Press Start 2P',monospace; overflow:hidden;
  }
  #gameWrapper {
    position:relative; border:4px solid #e94560; border-radius:12px;
    box-shadow:0 0 30px rgba(233,69,96,0.3),0 0 60px rgba(233,69,96,0.1),inset 0 0 30px rgba(0,0,0,0.3);
    overflow:hidden;
    /* 반응형: 뷰포트보다 클 경우 비율 유지하며 축소 */
    transform-origin: center center;
  }
  canvas { display:block; background:#16213e; }

  #overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:rgba(22,33,62,0.95); z-index:10; transition:opacity 0.3s;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 {
    color:#e94560; font-size:22px; text-shadow:0 0 20px rgba(233,69,96,0.5);
    margin-bottom:8px; letter-spacing:1px; padding:0 20px;
  }
  #overlay .poop-title { font-size:48px; margin-bottom:20px; animation:bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  #overlay .subtitle { color:#a8a8b3; font-size:13px; margin-bottom:24px; line-height:1.8; text-align:center; }

  .btn {
    background:#e94560; color:#fff; border:none; padding:12px 28px;
    font-family:'Press Start 2P',monospace; font-size:14px; cursor:pointer;
    border-radius:8px; transition:all 0.2s;
    box-shadow:0 4px 0 #b8344d,0 6px 20px rgba(233,69,96,0.3); margin:5px; white-space:nowrap;
  }
  .btn:hover  { transform:translateY(-2px); box-shadow:0 6px 0 #b8344d,0 8px 25px rgba(233,69,96,0.4); }
  .btn:active { transform:translateY(2px);  box-shadow:0 2px 0 #b8344d; }
  .btn.secondary {
    background:#2a3f6a; box-shadow:0 4px 0 #1a2744,0 6px 20px rgba(42,63,106,0.3); font-size:12px;
  }
  .btn.secondary:hover  { box-shadow:0 6px 0 #1a2744,0 8px 25px rgba(42,63,106,0.4); }
  .btn.secondary:active { box-shadow:0 2px 0 #1a2744; }
  .btn-row { display:flex; gap:8px; justify-content:center; margin-top:4px; }

  #gameOverText { color:#e94560; font-size:26px; margin-bottom:10px; text-shadow:0 0 20px rgba(233,69,96,0.5); }
  #finalScore   { color:#eee;    font-size:16px; margin-bottom:6px; }
  #highScoreText{ color:#f5a623; font-size:13px; margin-bottom:16px; }
  .controls-hint { color:#777; font-size:11px; margin-top:14px; text-align:center; line-height:2.2; }

  #nicknameSection { display:flex; flex-direction:column; align-items:center; margin-bottom:14px; width:100%; }
  #nicknameLabel { color:#a8a8b3; font-size:11px; margin-bottom:8px; }
  #nicknameInputRow { display:flex; gap:6px; align-items:center; justify-content:center; }
  #nicknameInput {
    background:#0f1b33; border:2px solid #2a3f6a; border-radius:6px; color:#fff;
    font-family:'Press Start 2P',monospace; font-size:13px; padding:8px 12px;
    width:160px; outline:none; transition:border-color 0.2s; text-align:center;
  }
  #nicknameInput:focus { border-color:#e94560; }
  #submitScoreBtn { background:#4aa3df; box-shadow:0 3px 0 #2980b9; font-size:11px; padding:8px 12px; }
  #submitScoreBtn:hover  { box-shadow:0 5px 0 #2980b9; }
  #submitScoreBtn:active { box-shadow:0 1px 0 #2980b9; }
  #submitMsg { font-size:11px; margin-top:6px; min-height:16px; }

  #lbPanel {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:408px; height:608px;
    background:rgba(15,23,51,0.99); z-index:9999;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 16px; overflow:hidden; opacity:0; pointer-events:none;
    transition:opacity 0.3s; border-radius:12px;
    border:4px solid #e94560;
    box-shadow:0 0 30px rgba(233,69,96,0.3),0 0 60px rgba(233,69,96,0.1);
  }
  #lbPanel.visible { opacity:1; pointer-events:all; }
  #lbTitle { color:#f5a623; font-size:17px; text-shadow:0 0 16px rgba(245,166,35,0.5); margin-bottom:4px; letter-spacing:1px; }
  #lbSubtitle { color:#555; font-size:10px; margin-bottom:16px; }
  #lbTable { width:100%; border-collapse:collapse; font-size:11px; }
  #lbTable thead tr th { color:#555; font-size:10px; padding:4px 6px; border-bottom:1px solid #1e2d50; text-align:left; }
  #lbTable thead tr th:nth-child(1) { width:28px; text-align:center; }
  #lbTable thead tr th:nth-child(3),
  #lbTable thead tr th:nth-child(4) { text-align:right; }
  #lbTable tbody tr { border-bottom:1px solid #111d35; transition:background 0.15s; }
  #lbTable tbody tr:hover { background:rgba(233,69,96,0.06); }
  #lbTable tbody tr.my-score { background:rgba(245,166,35,0.1); }
  #lbTable tbody tr.my-score td { color:#f5a623; }
  #lbTable tbody td { padding:7px 6px; color:#ccc; vertical-align:middle; line-height:1.4; }
  #lbTable tbody td:nth-child(1) { text-align:center; color:#555; }
  #lbTable tbody td:nth-child(3),
  #lbTable tbody td:nth-child(4) { text-align:right; }
  .rank-medal { font-size:16px; }
  .stage-badge { background:#1a2744; border-radius:4px; padding:2px 5px; font-size:9px; color:#4aa3df; }
  #lbLoading,#lbEmpty { color:#555; font-size:11px; margin-top:40px; text-align:center; line-height:2; }
  #lbCloseBtn { margin-top:16px; }
  #lbScrollWrap { width:100%; overflow-y:auto; max-height:380px; scrollbar-width:thin; scrollbar-color:#2a3f6a #0f1b33; }
  #lbScrollWrap::-webkit-scrollbar { width:4px; }
  #lbScrollWrap::-webkit-scrollbar-track { background:#0f1b33; }
  #lbScrollWrap::-webkit-scrollbar-thumb { background:#2a3f6a; border-radius:2px; }

  /* ── PAUSE OVERLAY ── */
  #pausePanel {
    position:absolute; top:0; left:0; right:0; bottom:0;
    background:rgba(10,15,35,0.82);
    backdrop-filter:blur(3px);
    z-index:15;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.2s;
  }
  #pausePanel.visible { opacity:1; pointer-events:all; }
  #pauseIcon  { font-size:52px; margin-bottom:10px; }
  #pauseTitle { color:#fff; font-size:20px; margin-bottom:6px;
                text-shadow:0 0 20px rgba(255,255,255,0.3); letter-spacing:2px; }
  #pauseHint  { color:#556; font-size:9px; margin-bottom:28px; text-align:center; line-height:2.4; }
  #pauseBtn   { background:#2a3f6a; box-shadow:0 4px 0 #1a2744; font-size:13px;
                padding:13px 32px; }
  #pauseBtn:hover  { box-shadow:0 6px 0 #1a2744; }
  #pauseBtn:active { box-shadow:0 2px 0 #1a2744; transform:translateY(2px); }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>

  <!-- ── START / GAMEOVER OVERLAY ── -->
  <div id="overlay">
    <div class="poop-title">💩</div>
    <h1>Poop Survivor</h1>
    <div class="subtitle">똥을 피하고 살아남아라!</div>
    <div class="btn-row">
      <button class="btn" id="startBtn">START</button>
      <button class="btn secondary" id="showLbBtn">🏆 명예의 전당</button>
    </div>
    <div class="controls-hint">← → 방향키 또는 터치로 이동<br>↑ 또는 스페이스바로 점프<br>P / ESC — 일시정지</div>
  </div>

  <!-- ── PAUSE PANEL ── -->
  <div id="pausePanel">
    <div id="pauseIcon">⏸</div>
    <div id="pauseTitle">PAUSED</div>
    <div id="pauseHint">ESC 또는 P 키로 재개<br>모바일: 화면 탭</div>
    <button class="btn" id="pauseBtn">▶ 계속하기</button>
  </div>
</div>

<!-- ── LEADERBOARD PANEL (gameWrapper 바깥 — overflow:hidden 영향 없음) ── -->
<div id="lbPanel">
  <div id="lbTitle">🏆 명예의 전당</div>
  <div id="lbSubtitle">TOP 10 생존자</div>
  <div id="lbScrollWrap">
    <table id="lbTable">
      <thead><tr><th>순위</th><th>닉네임</th><th>점수</th><th>스테이지</th></tr></thead>
      <tbody id="lbBody"></tbody>
    </table>
    <div id="lbLoading">불러오는 중...</div>
    <div id="lbEmpty" style="display:none">기록이 없습니다.<br>첫 번째 생존자가 되세요!</div>
  </div>
  <button class="btn secondary" id="lbCloseBtn">← 돌아가기</button>
</div>

<script>
// ============================================================
// API
// ============================================================
async function fetchLeaderboard() {
  const res = await fetch('/api/scores');
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function insertScore(nickname, score, stage) {
  const res = await fetch('/api/scores', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nickname, score, stage}),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ============================================================
// LEADERBOARD UI
// ============================================================
const lbPanel   = document.getElementById('lbPanel');
const lbBody    = document.getElementById('lbBody');
const lbLoading = document.getElementById('lbLoading');
const lbEmpty   = document.getElementById('lbEmpty');

// 전역 1위 기록 캐시
let topRecord = null;

async function openLeaderboard(myScore=null) {
  lbPanel.classList.add('visible');
  lbBody.innerHTML=''; lbLoading.style.display='block'; lbEmpty.style.display='none';
  try {
    const rows = await fetchLeaderboard();
    lbLoading.style.display='none';
    if (!rows||rows.length===0){lbEmpty.style.display='block';return;}
    // 1위 캐시 업데이트 — 전역 및 현재 게임 인스턴스 동시 갱신
    if (rows[0]){
      topRecord = {nickname:rows[0].nickname, score:rows[0].score};
      if(game) game.topRecord = topRecord;
    }
    const medals=['🥇','🥈','🥉'];
    const stageColors=['','#4aa3df','#2ecc71','#f5a623','#e94560','#9b59b6'];
    rows.forEach((row,i)=>{
      const isMe=myScore&&row.nickname===myScore.nickname&&row.score===myScore.score;
      const rankCell=i<3?`<span class="rank-medal">${medals[i]}</span>`:`<span style="color:#555">${i+1}</span>`;
      const sc=stageColors[Math.min(row.stage,5)]||'#4aa3df';
      const tr=document.createElement('tr');
      if(isMe)tr.classList.add('my-score');
      tr.innerHTML=`<td>${rankCell}</td><td>${escHtml(row.nickname)}${isMe?' 👈':''}</td><td style="color:#fff;font-weight:bold">${row.score.toLocaleString()}</td><td><span class="stage-badge" style="color:${sc}">S${row.stage}</span></td>`;
      lbBody.appendChild(tr);
    });
  } catch(e) { lbLoading.textContent='⚠ 불러오기 실패'; console.error(e); }
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.getElementById('lbCloseBtn').onclick=()=>{
  lbPanel.classList.remove('visible');
};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn= document.getElementById('startBtn');
const W=400, H=600;
canvas.width=W; canvas.height=H;

// ── 반응형 스케일링 ──────────────────────────────────────────
const gameWrapper = document.getElementById('gameWrapper');
function scaleGame(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const WRAPPER_W = W + 8;  // border 4px × 2
  const WRAPPER_H = H + 8;
  const scaleX = vw / WRAPPER_W;
  const scaleY = vh / WRAPPER_H;
  const scale  = Math.min(scaleX, scaleY, 1); // 1 이하로만 축소 (확대 없음)
  gameWrapper.style.transform = `scale(${scale})`;
}
scaleGame();
window.addEventListener('resize', scaleGame);

let game=null, highScore=0, animFrameId=null, paused=false;
const pausePanel = document.getElementById('pausePanel');

function togglePause(){
  if(!game || game.gameOver) return;
  paused = !paused;
  if(paused){
    pausePanel.classList.add('visible');
    // 키 입력 초기화 (일시정지 시 방향키 눌린 상태 해제)
    game.keys.left=false; game.keys.right=false; game.keys.up=false;
  } else {
    pausePanel.classList.remove('visible');
  }
}

// ============================================================
// DAY/NIGHT CYCLE — 배경 테마 정의 (궤도 기반)
// ============================================================
// body: 'moon' | 'sun'
// orbitStart: 해당 테마 시작 시 천체의 orbitT 초기값
const BG_THEMES = [
  { sky0:'#0f1123', sky1:'#16213e', ground:'#1a2744', groundLine:'#2a3f6a',
    body:'moon', sunR:22, sunColor:'#d4e0f0', sunGlow:'rgba(200,220,255,0.3)',
    starAlpha:1.0, label:'밤', scoreThreshold:0,   orbitStart:0.15 },
  { sky0:'#1a1040', sky1:'#3d1a5e', ground:'#2a1a44', groundLine:'#4a2a7a',
    body:'sun',  sunR:28, sunColor:'#ff8c69', sunGlow:'rgba(255,140,105,0.35)',
    starAlpha:0.4, label:'새벽', scoreThreshold:100, orbitStart:0.04 },
  { sky0:'#c94a10', sky1:'#f0a060', ground:'#2d4a2d', groundLine:'#3d6a3d',
    body:'sun',  sunR:34, sunColor:'#ffdd57', sunGlow:'rgba(255,200,80,0.45)',
    starAlpha:0.0, label:'일출', scoreThreshold:250, orbitStart:0.24 },
  { sky0:'#1a78c8', sky1:'#56b4e9', ground:'#2d6a2d', groundLine:'#3d8a3d',
    body:'sun',  sunR:30, sunColor:'#ffe44d', sunGlow:'rgba(255,228,77,0.5)',
    starAlpha:0.0, label:'낮', scoreThreshold:450,  orbitStart:0.44 },
  { sky0:'#080818', sky1:'#0d1b3e', ground:'#1a2030', groundLine:'#2a3050',
    body:'moon', sunR:24, sunColor:'#d4e0f0', sunGlow:'rgba(200,220,255,0.3)',
    starAlpha:1.0, label:'밤하늘', scoreThreshold:700, orbitStart:0.04 },
];

// 1프레임당 orbitT 증가량 (60fps 기준 전체 이동 약 6~7분)
const ORBIT_SPEED = 0.000038;

// orbitT(0→1) → 화면상 x,y (포물선 궤도)
// t=0: 왼쪽 지평선 아래  t=0.5: 정점  t=1: 오른쪽 지평선 아래
function orbitPos(t, r){
  const x = -r + (W + r * 2) * t;
  const peakY  = 55;
  const horizY = H + r + 10;
  const y = horizY - (horizY - peakY) * Math.sin(Math.PI * t);
  return {x, y};
}

// 보간 유틸
function lerpColor(c1,c2,t){
  const hex2rgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [r1,g1,b1]=hex2rgb(c1), [r2,g2,b2]=hex2rgb(c2);
  return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
}
function lerpN(a,b,t){return a+(b-a)*t;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

// ============================================================
// STAGE CONFIG
// ============================================================
const STAGES=[
  {name:'STAGE 1',color:'#4aa3df',spawnInterval:28,baseSpeed:3.8,speedVariance:2.0,doubleChance:0.30,tripleChance:0,swayChance:0.15,shieldDrop:false,shieldDropInterval:9999,freeShields:0,scoreThreshold:0},
  {name:'STAGE 2',color:'#2ecc71',spawnInterval:24,baseSpeed:4.5,speedVariance:2.5,doubleChance:0.40,tripleChance:0.10,swayChance:0.25,shieldDrop:true,shieldDropInterval:550,freeShields:1,scoreThreshold:50},
  {name:'STAGE 3',color:'#f5a623',spawnInterval:20,baseSpeed:5.2,speedVariance:3.0,doubleChance:0.50,tripleChance:0.20,swayChance:0.35,shieldDrop:true,shieldDropInterval:480,freeShields:1,scoreThreshold:150},
  {name:'STAGE 4',color:'#e94560',spawnInterval:16,baseSpeed:6.0,speedVariance:3.5,doubleChance:0.55,tripleChance:0.30,swayChance:0.45,shieldDrop:true,shieldDropInterval:420,freeShields:1,scoreThreshold:300},
  {name:'STAGE 5',color:'#9b59b6',spawnInterval:12,baseSpeed:7.0,speedVariance:4.0,doubleChance:0.60,tripleChance:0.40,swayChance:0.55,shieldDrop:true,shieldDropInterval:380,freeShields:1,scoreThreshold:500},
];

// ============================================================
// Player
// ============================================================
class Player {
  constructor(){
    this.x=W/2; this.y=H-60; this.vx=0; this.vy=0;
    this.speed=5; this.onGround=true; this.jumpPower=-11; this.gravity=0.55;
    this.groundY=H-60; this.facing=1; this.walkFrame=0; this.walkTimer=0;
    this.isHit=false; this.hitTimer=0;
  }
  update(keys){
    let moving=false;
    if(keys.left){this.vx=-this.speed;this.facing=-1;moving=true;}
    else if(keys.right){this.vx=this.speed;this.facing=1;moving=true;}
    else this.vx=0;
    if(moving&&this.onGround){this.walkTimer++;if(this.walkTimer>6){this.walkTimer=0;this.walkFrame=(this.walkFrame+1)%4;}}
    else{this.walkFrame=0;this.walkTimer=0;}
    if(keys.up&&this.onGround){this.vy=this.jumpPower;this.onGround=false;}
    this.vy+=this.gravity; this.y+=this.vy; this.x+=this.vx;
    if(this.y>=this.groundY){this.y=this.groundY;this.vy=0;this.onGround=true;}
    if(this.x<14)this.x=14; if(this.x>W-14)this.x=W-14;
    if(this.isHit){this.hitTimer--;if(this.hitTimer<=0)this.isHit=false;}
  }
  draw(ctx,hasShield,time){
    if(this.isHit&&Math.floor(this.hitTimer/3)%2===0)return;
    ctx.save(); ctx.translate(this.x,this.y);
    const legOff=[0,4,0,-4][this.walkFrame], armOff=[0,-3,0,3][this.walkFrame];
    ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,22,14,4,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(-6+legOff,20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(6-legOff,20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(0,8); ctx.stroke();
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(-10+armOff,4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(10-armOff,4); ctx.stroke();
    ctx.fillStyle='#e0e0e0'; ctx.beginPath(); ctx.arc(0,-14,8,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#16213e';
    ctx.beginPath(); ctx.arc(this.facing*2-2,-15,1.5,0,Math.PI*2); ctx.arc(this.facing*2+3,-15,1.5,0,Math.PI*2); ctx.fill();
    if(hasShield){
      const pulse=0.4+Math.sin((time||0)*0.08)*0.15;
      ctx.strokeStyle=`rgba(74,163,255,${pulse})`; ctx.lineWidth=2.5;
      ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(0,2,24,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
  }
  getBounds(){return{x:this.x-10,y:this.y-22,w:20,h:42};}
}

// ============================================================
// Poop
// ============================================================
class Poop {
  constructor(speed,sway){
    this.size=20+Math.random()*16; this.x=Math.random()*(W-40)+20; this.y=-this.size;
    this.speed=speed+Math.random()*2.5; this.rotation=Math.random()*Math.PI*2;
    this.rotSpeed=(Math.random()-0.5)*0.08;
    this.sway=!!sway; this.swayBase=this.x; this.swayAngle=Math.random()*Math.PI*2;
  }
  update(){
    this.y+=this.speed; this.rotation+=this.rotSpeed;
    if(this.sway){this.swayAngle+=0.04; this.x=this.swayBase+Math.sin(this.swayAngle)*40;}
  }
  draw(ctx){
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rotation);
    const s=this.size;
    ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(2,s*0.35,s*0.45,s*0.15,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#8B6914'; ctx.beginPath(); ctx.ellipse(0,s*0.18,s*0.4,s*0.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9B7424'; ctx.beginPath(); ctx.ellipse(0,-s*0.02,s*0.3,s*0.17,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#A88030'; ctx.beginPath(); ctx.ellipse(0,-s*0.2,s*0.18,s*0.13,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-s*0.33,s*0.08,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-s*0.12,-s*0.05,s*0.07,0,Math.PI*2); ctx.arc(s*0.12,-s*0.05,s*0.07,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-s*0.10,-s*0.04,s*0.035,0,Math.PI*2); ctx.arc(s*0.14,-s*0.04,s*0.035,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  getBounds(){return{x:this.x-this.size*0.35,y:this.y-this.size*0.3,w:this.size*0.7,h:this.size*0.55};}
  isOffScreen(){return this.y>H+30;}
}

// ============================================================
// GoldenPoop — 황금 똥 (화면의 모든 일반 똥 제거)
// ============================================================
class GoldenPoop {
  constructor(speed){
    this.size=26; this.x=Math.random()*(W-60)+30; this.y=-this.size;
    this.speed=speed*0.75+1; this.rotation=0; this.rotSpeed=0.06;
    this.glowPhase=0;
  }
  update(){this.y+=this.speed; this.rotation+=this.rotSpeed; this.glowPhase+=0.12;}
  draw(ctx){
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rotation);
    const s=this.size, glow=0.5+Math.sin(this.glowPhase)*0.3;
    // 황금 광채
    const rg=ctx.createRadialGradient(0,0,s*0.3,0,0,s*1.5);
    rg.addColorStop(0,`rgba(255,220,50,${glow})`); rg.addColorStop(1,'rgba(255,180,0,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,s*1.5,0,Math.PI*2); ctx.fill();
    // 황금 몸체
    ctx.fillStyle='#b8860b'; ctx.beginPath(); ctx.ellipse(2,s*0.35,s*0.45,s*0.15,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.ellipse(0,s*0.18,s*0.4,s*0.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffe44d'; ctx.beginPath(); ctx.ellipse(0,-s*0.02,s*0.3,s*0.17,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffec80'; ctx.beginPath(); ctx.ellipse(0,-s*0.2,s*0.18,s*0.13,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-s*0.33,s*0.08,0,Math.PI*2); ctx.fill();
    // 반짝이 하이라이트
    ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-s*0.1,-s*0.1,s*0.08,s*0.05,-0.5,0,Math.PI*2); ctx.fill();
    // 눈
    ctx.fillStyle='#5a3a00'; ctx.beginPath(); ctx.arc(-s*0.12,-s*0.05,s*0.06,0,Math.PI*2); ctx.arc(s*0.12,-s*0.05,s*0.06,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-s*0.10,-s*0.04,s*0.025,0,Math.PI*2); ctx.arc(s*0.14,-s*0.04,s*0.025,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  getBounds(){return{x:this.x-this.size*0.4,y:this.y-this.size*0.3,w:this.size*0.8,h:this.size*0.6};}
  isOffScreen(){return this.y>H+30;}
}

// ============================================================
// HeartItem — 하트 아이템 (라이프 +1)
// ============================================================
class HeartItem {
  constructor(){
    this.x=Math.random()*(W-60)+30; this.y=-20;
    this.speed=1.8+Math.random()*0.8; this.size=13;
    this.bobAngle=Math.random()*Math.PI*2; this.glow=0;
  }
  update(){this.y+=this.speed; this.bobAngle+=0.07; this.glow++;}
  draw(ctx){
    ctx.save(); ctx.translate(this.x, this.y+Math.sin(this.bobAngle)*5);
    const s=this.size, ga=0.35+Math.sin(this.glow*0.1)*0.2;
    // 핑크 글로우
    ctx.fillStyle=`rgba(255,80,120,${ga})`; ctx.beginPath(); ctx.arc(0,0,s+7,0,Math.PI*2); ctx.fill();
    // 하트 본체
    ctx.fillStyle='#ff4466';
    ctx.beginPath();
    ctx.moveTo(0,s*0.4);
    ctx.bezierCurveTo(0,-s*0.2,-s,-s*0.2,-s,s*0.15);
    ctx.bezierCurveTo(-s,s*0.7,0,s,0,s*1.3);
    ctx.bezierCurveTo(0,s,s,s*0.7,s,s*0.15);
    ctx.bezierCurveTo(s,-s*0.2,0,-s*0.2,0,s*0.4);
    ctx.closePath(); ctx.fill();
    // 하이라이트
    ctx.fillStyle='rgba(255,200,210,0.6)'; ctx.beginPath(); ctx.ellipse(-s*0.25,-s*0.1,s*0.2,s*0.13,-0.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  getBounds(){return{x:this.x-this.size,y:this.y-this.size,w:this.size*2,h:this.size*2};}
  isOffScreen(){return this.y>H+30;}
}

// ============================================================
// ShieldItem
// ============================================================
class ShieldItem {
  constructor(){
    this.x=Math.random()*(W-60)+30; this.y=-20;
    this.speed=2+Math.random(); this.size=16;
    this.bobAngle=Math.random()*Math.PI*2; this.glow=0;
  }
  update(){this.y+=this.speed; this.bobAngle+=0.06; this.glow++;}
  draw(ctx){
    ctx.save(); ctx.translate(this.x,this.y+Math.sin(this.bobAngle)*4);
    const s=this.size, ga=0.3+Math.sin(this.glow*0.1)*0.2;
    ctx.fillStyle=`rgba(74,163,255,${ga})`; ctx.beginPath(); ctx.arc(0,0,s+6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#4aa3df'; ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2980b9'; ctx.beginPath(); ctx.arc(0,0,s-4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#4aa3df'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-s*0.5); ctx.lineTo(0,s*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.5,0); ctx.lineTo(s*0.5,0); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(-s*0.25,-s*0.25,s*0.25,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  getBounds(){return{x:this.x-this.size,y:this.y-this.size,w:this.size*2,h:this.size*2};}
  isOffScreen(){return this.y>H+30;}
}

// ============================================================
// Particle
// ============================================================
class Particle {
  constructor(x,y,color,vx,vy){
    this.x=x; this.y=y;
    this.vx=vx!==undefined?vx:(Math.random()-0.5)*6;
    this.vy=vy!==undefined?vy:-Math.random()*5-2;
    this.life=30+Math.random()*20; this.maxLife=this.life;
    this.size=3+Math.random()*4;
    this.color=color||['#8B6914','#9B7424','#A88030','#6B5010'][Math.floor(Math.random()*4)];
  }
  update(){this.x+=this.vx; this.y+=this.vy; this.vy+=0.2; this.life--;}
  draw(ctx){
    ctx.globalAlpha=this.life/this.maxLife; ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.size*(this.life/this.maxLife),0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
}

// ============================================================
// Star
// ============================================================
class Star {
  constructor(){
    this.x=Math.random()*W; this.y=Math.random()*H;
    this.size=Math.random()*1.5+0.5;
    this.blinkSpeed=Math.random()*0.03+0.01; this.blinkOffset=Math.random()*Math.PI*2;
  }
  draw(ctx,time,alpha){
    if(alpha<=0)return;
    ctx.fillStyle=`rgba(255,255,255,${(0.3+Math.sin(time*this.blinkSpeed+this.blinkOffset)*0.25)*alpha})`;
    ctx.fillRect(this.x,this.y,this.size,this.size);
  }
}

// ============================================================
// Game
// ============================================================
class Game {
  constructor(){
    this.player=new Player();
    this.poops=[]; this.goldenPoops=[]; this.shieldItems=[];
    this.heartItems=[]; this.particles=[];
    this.stars=Array.from({length:60},()=>new Star());
    this.score=0; this.lives=3; this.maxLives=5;
    this.shields=0; this.maxShields=3;
    this.time=0; this.spawnTimer=0; this.shieldSpawnTimer=0;
    this.heartSpawnTimer=0; this.goldenSpawnTimer=0;
    this.stage=0; this.gameOver=false;
    this.dodged=0; this.combo=0; this.maxCombo=0;
    this.shakeTimer=0; this.shakeIntensity=0;
    this.keys={left:false,right:false,up:false};
    this.comboText=''; this.comboTextTimer=0;
    this.stageText=STAGES[0].name; this.stageTextTimer=90;
    this.shieldText=''; this.shieldTextTimer=0;
    this.notifyText=''; this.notifyTimer=0; this.notifyColor='#fff';

    // Day/Night cycle ─────────────────────────────────────────
    this.bgIdx     = 0;           // 현재 배경 테마 인덱스
    this.bgT       = 0;           // 배경색 보간 (0→1, 4초)
    this.bgFading  = false;       // 배경색 전환 중 여부

    // 천체(해/달) — A/B 두 슬롯으로 관리
    // A: 현재 표시 중인 천체  B: 다음에 뜰 천체 (설정 후 숨겨짐)
    this.bodyA     = { ...BG_THEMES[0], orbitT: BG_THEMES[0].orbitStart, alpha: 1 };
    this.bodyB     = null;        // 전환 시 생성
    this.bodyState = 'normal';    // 'normal' | 'a_setting' | 'b_rising'
    //  normal   : A 혼자 이동 중
    //  a_setting: A가 오른쪽으로 지고 있는 중 (orbitT→1)
    //  b_rising : A가 사라지고 B가 왼쪽에서 뜨는 중

    this.nextBgIdx = 0;           // 다음 테마 인덱스 (전환 대기)

    // 상단 리더보드 표시
    this.topRecord=topRecord; // 전역 캐시 참조
  }

  cfg(){return STAGES[this.stage];}

  // 현재 보간된 배경색/지면 값 반환
  getBgValues(){
    const a = BG_THEMES[this.bgIdx];
    const b = BG_THEMES[Math.min(this.bgIdx+1, BG_THEMES.length-1)];
    const t = this.bgT;
    if(t<=0) return { sky0:a.sky0, sky1:a.sky1, ground:a.ground, groundLine:a.groundLine, starAlpha:a.starAlpha };
    return {
      sky0:      lerpColor(a.sky0, b.sky0, t),
      sky1:      lerpColor(a.sky1, b.sky1, t),
      ground:    lerpColor(a.ground, b.ground, t),
      groundLine:lerpColor(a.groundLine, b.groundLine, t),
      starAlpha: lerpN(a.starAlpha, b.starAlpha, t),
    };
  }

  update(){
    if(this.gameOver)return;
    this.time++; this.score=Math.floor(this.time/6);

    // ══════════════════════════════════════════════════════════
    // 천체 궤도 & 전환 상태머신
    // ══════════════════════════════════════════════════════════

    // 점수 기반으로 목표 테마 인덱스 결정
    let targetBgIdx = 0;
    for(let i=BG_THEMES.length-1; i>=0; i--){
      if(this.score >= BG_THEMES[i].scoreThreshold){ targetBgIdx=i; break; }
    }

    // 새 테마 진입 감지 → a_setting 시작
    if(targetBgIdx > this.bgIdx && this.bodyState === 'normal' && !this.bgFading){
      this.nextBgIdx   = targetBgIdx;
      this.bodyState   = 'a_setting'; // A가 지도록 내버려 둠
      this.bgFading    = true;
      this.bgT         = 0;
    }

    // 배경색 서서히 전환 (bgFading 중)
    if(this.bgFading){
      this.bgT = clamp(this.bgT + 0.003, 0, 1); // 약 5.5초
      if(this.bgT >= 1){
        this.bgIdx  = this.nextBgIdx;
        this.bgT    = 0;
        this.bgFading = false;
      }
    }

    // ── A 천체 이동
    this.bodyA.orbitT = clamp(this.bodyA.orbitT + ORBIT_SPEED, 0, 1);

    // ── 상태머신 전환
    if(this.bodyState === 'a_setting'){
      // A가 오른쪽 지평선(orbitT >= 0.96)으로 지면 → B를 왼쪽에서 띄움
      if(this.bodyA.orbitT >= 0.96){
        const next = BG_THEMES[this.nextBgIdx];
        this.bodyB = { ...next, orbitT: 0.0, alpha: 1 };
        this.bodyA = this.bodyB;   // A를 B로 교체 (이제 A만 관리)
        this.bodyB = null;
        this.bodyState = 'normal';
      }
    }

    // ── B 천체 이동 (사용 시)
    if(this.bodyB){
      this.bodyB.orbitT = clamp(this.bodyB.orbitT + ORBIT_SPEED, 0, 1);
    }

    // ── 스테이지 체크
    let ns=0;
    for(let i=STAGES.length-1;i>=0;i--){if(this.score>=STAGES[i].scoreThreshold){ns=i;break;}}
    if(ns!==this.stage){
      this.stage=ns; const c=this.cfg();
      this.stageText=c.name; this.stageTextTimer=90;
      if(this.stage>=1&&c.freeShields>0&&this.shields<this.maxShields){
        this.shields=Math.min(this.maxShields,this.shields+c.freeShields);
        this.shieldText=`방패 지급! (${this.shields}/${this.maxShields})`; this.shieldTextTimer=70;
      }
    }
    const c=this.cfg();

    // ── 일반 똥 스폰
    this.spawnTimer++;
    if(this.spawnTimer>=c.spawnInterval){
      this.spawnTimer=0;
      this.poops.push(new Poop(c.baseSpeed,Math.random()<c.swayChance));
      if(Math.random()<c.doubleChance) this.poops.push(new Poop(c.baseSpeed+0.5+Math.random()*c.speedVariance*0.3,Math.random()<c.swayChance));
      if(Math.random()<c.tripleChance) this.poops.push(new Poop(c.baseSpeed+1.0+Math.random()*c.speedVariance*0.5,Math.random()<c.swayChance*1.2));
    }

    // ── 황금 똥 스폰 (3% 확률 / 180프레임마다 체크)
    this.goldenSpawnTimer++;
    if(this.goldenSpawnTimer>=180){
      this.goldenSpawnTimer=0;
      if(Math.random()<0.03) this.goldenPoops.push(new GoldenPoop(c.baseSpeed));
    }

    // ── 하트 아이템 스폰 (1% 확률 / 300프레임마다)
    this.heartSpawnTimer++;
    if(this.heartSpawnTimer>=300){
      this.heartSpawnTimer=0;
      if(Math.random()<0.01&&this.lives<this.maxLives) this.heartItems.push(new HeartItem());
    }

    // ── 방패 스폰
    if(c.shieldDrop){
      this.shieldSpawnTimer++;
      if(this.shieldSpawnTimer>=c.shieldDropInterval){
        this.shieldSpawnTimer=0;
        if(this.shields<this.maxShields) this.shieldItems.push(new ShieldItem());
      }
    }

    this.player.update(this.keys);

    // ── 황금 똥 충돌
    for(let i=this.goldenPoops.length-1;i>=0;i--){
      const gp=this.goldenPoops[i]; gp.update();
      if(gp.isOffScreen()){this.goldenPoops.splice(i,1);continue;}
      if(this.checkCol(this.player.getBounds(),gp.getBounds())){
        // 화면 내 모든 일반 똥 제거 + 파티클 폭발
        const cleared=this.poops.length;
        this.poops.forEach(p=>{
          for(let j=0;j<6;j++) this.particles.push(new Particle(p.x,p.y,'#ffd700',(Math.random()-0.5)*8,-Math.random()*6-1));
        });
        this.poops=[];
        // 화면 중앙 황금 파티클 폭발
        for(let j=0;j<40;j++){
          const angle=Math.random()*Math.PI*2, speed=2+Math.random()*5;
          const colors=['#ffd700','#ffe44d','#ffec80','#fff4b0','#fff'];
          this.particles.push(new Particle(W/2,H/2,colors[Math.floor(Math.random()*colors.length)],
            Math.cos(angle)*speed,Math.sin(angle)*speed-2));
        }
        this.goldenPoops.splice(i,1);
        this.notifyText=`✨ 황금 똥! ${cleared}개 제거!`;
        this.notifyColor='#ffd700'; this.notifyTimer=90;
      }
    }

    // ── 하트 아이템 충돌
    for(let i=this.heartItems.length-1;i>=0;i--){
      const hi=this.heartItems[i]; hi.update();
      if(hi.isOffScreen()){this.heartItems.splice(i,1);continue;}
      if(this.checkCol(this.player.getBounds(),hi.getBounds())){
        if(this.lives<this.maxLives){
          this.lives++;
          for(let j=0;j<10;j++) this.particles.push(new Particle(hi.x,hi.y,'#ff4466',(Math.random()-0.5)*5,-Math.random()*4-1));
          this.notifyText=`❤ 하트 획득! (${this.lives}/${this.maxLives})`;
          this.notifyColor='#ff4466'; this.notifyTimer=70;
        }
        this.heartItems.splice(i,1);
      }
    }

    // ── 방패 아이템 충돌
    for(let i=this.shieldItems.length-1;i>=0;i--){
      const si=this.shieldItems[i]; si.update();
      if(si.isOffScreen()){this.shieldItems.splice(i,1);continue;}
      if(this.checkCol(this.player.getBounds(),si.getBounds())){
        if(this.shields<this.maxShields){
          this.shields++;
          this.shieldText=`방패 획득! (${this.shields}/${this.maxShields})`; this.shieldTextTimer=70;
          for(let j=0;j<8;j++) this.particles.push(new Particle(si.x,si.y,['#4aa3df','#2980b9','#74b9ff','#a3d8f4'][Math.floor(Math.random()*4)]));
        }
        this.shieldItems.splice(i,1);
      }
    }

    // ── 일반 똥 충돌
    for(let i=this.poops.length-1;i>=0;i--){
      const p=this.poops[i]; p.update();
      if(p.isOffScreen()){
        this.poops.splice(i,1); this.dodged++; this.combo++;
        if(this.combo>this.maxCombo)this.maxCombo=this.combo;
        if(this.combo%10===0&&this.combo>0){this.comboText=`${this.combo} COMBO!`;this.comboTextTimer=60;}
        continue;
      }
      if(!this.player.isHit&&this.checkCol(this.player.getBounds(),p.getBounds())){
        this.combo=0; this.player.isHit=true; this.player.hitTimer=40;
        this.shakeTimer=12; this.shakeIntensity=6;
        for(let j=0;j<12;j++) this.particles.push(new Particle(p.x,p.y));
        this.poops.splice(i,1);
        if(this.shields>0){
          this.shields--;
          this.shieldText=`방패 사용! (${this.shields}/${this.maxShields})`; this.shieldTextTimer=70;
        } else {
          this.lives--;
          if(this.lives<=0){
            this.gameOver=true;
            if(this.score>highScore)highScore=this.score;
            setTimeout(()=>showGameOver(this.stage+1,this.score),500);
          }
        }
      }
    }

    for(let i=this.particles.length-1;i>=0;i--){this.particles[i].update();if(this.particles[i].life<=0)this.particles.splice(i,1);}
    if(this.shakeTimer>0)this.shakeTimer--;
    if(this.comboTextTimer>0)this.comboTextTimer--;
    if(this.stageTextTimer>0)this.stageTextTimer--;
    if(this.shieldTextTimer>0)this.shieldTextTimer--;
    if(this.notifyTimer>0)this.notifyTimer--;
  }

  checkCol(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

  draw(){
    ctx.save();
    if(this.shakeTimer>0){
      const s=this.shakeIntensity*(this.shakeTimer/12);
      ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);
    }

    const bg = this.getBgValues();
    this._moonSkyColor = bg.sky0;

    // ── 하늘 배경
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,bg.sky0); grad.addColorStop(1,bg.sky1);
    ctx.fillStyle=grad; ctx.fillRect(-10,-10,W+20,H+20);

    // ── 별
    this.stars.forEach(s=>s.draw(ctx,this.time,bg.starAlpha));

    // ── 해 / 달 — bodyA (항상 그림), bodyB는 사용 안 함(현재 구조상 null)
    this._drawBody(this.bodyA);
    if(this.bodyB) this._drawBody(this.bodyB);

    // ── 지면
    ctx.fillStyle=bg.ground; ctx.fillRect(0,H-35,W,35);
    ctx.strokeStyle=bg.groundLine; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,H-35); ctx.lineTo(W,H-35); ctx.stroke();
    ctx.fillStyle=bg.groundLine;
    for(let i=0;i<W;i+=20) ctx.fillRect(i+((this.time*0.5)%20),H-28,2,2);

    // ── 오브젝트
    this.shieldItems.forEach(si=>si.draw(ctx));
    this.heartItems.forEach(hi=>hi.draw(ctx));
    this.goldenPoops.forEach(gp=>gp.draw(ctx));
    this.poops.forEach(p=>p.draw(ctx));
    this.particles.forEach(p=>p.draw(ctx));
    this.player.draw(ctx,this.shields>0,this.time);
    this.drawHUD();
    ctx.restore();
  }

  drawSun(ctx,x,y,r,color,glowColor){
    ctx.save(); ctx.translate(x,y);
    const rot = this.time * 0.008;
    for(let i=0;i<8;i++){
      ctx.save(); ctx.rotate(i*Math.PI/4+rot);
      ctx.fillStyle=glowColor; ctx.beginPath();
      ctx.moveTo(0,-r*1.2); ctx.lineTo(-r*0.15,-r*1.8); ctx.lineTo(r*0.15,-r*1.8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    const rg=ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.8);
    rg.addColorStop(0,glowColor); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,r*1.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=color; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  drawMoon(ctx,x,y,r){
    ctx.save(); ctx.translate(x,y);
    const glow=ctx.createRadialGradient(0,0,r*0.5,0,0,r*2);
    glow.addColorStop(0,'rgba(200,220,255,0.3)'); glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,r*2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#c8d8ec'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    // 크레이터
    const craters=[[r*0.3,-r*0.2,r*0.15],[-r*0.2,r*0.1,r*0.1],[r*0.05,r*0.35,r*0.08]];
    craters.forEach(([cx,cy,cr])=>{
      ctx.fillStyle='rgba(160,185,215,0.7)'; ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
    });
    // 초승달 — 현재 하늘색으로 오버레이 (getBgValues 재호출 대신 캐시)
    const skyOverlay = this._moonSkyColor || '#0f1123';
    ctx.fillStyle=skyOverlay;
    ctx.beginPath(); ctx.arc(r*0.38,0,r*0.82,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  _drawBody(b){
    const pos = orbitPos(b.orbitT, b.sunR);
    if(b.body === 'moon') this.drawMoon(ctx, pos.x, pos.y, b.sunR);
    else                  this.drawSun (ctx, pos.x, pos.y, b.sunR, b.sunColor, b.sunGlow);
  }

  drawHUD(){
    const c=this.cfg();

    // ── 점수
    ctx.fillStyle='#e94560'; ctx.font='12px "Press Start 2P", monospace';
    ctx.textAlign='left'; ctx.fillText('SCORE',12,24);
    ctx.fillStyle='#fff'; ctx.font='18px "Press Start 2P", monospace';
    ctx.fillText(`${this.score}`,12,46);

    // ── 스테이지
    ctx.textAlign='center'; ctx.fillStyle=c.color; ctx.font='9px "Press Start 2P", monospace';
    ctx.fillText(c.name,W/2,20);

    // ── 상단 1위 리더보드 하이라이트
    const rec = this.topRecord || topRecord; // 인스턴스 캐시 → 전역 캐시 순으로 참조
    if(rec && rec.nickname && rec.score != null){
      ctx.save();
      ctx.textAlign='center';
      ctx.font='10px "Press Start 2P", monospace';
      // Canvas에는 escHtml 불필요 — 원본 문자열 그대로 사용
      const nick = String(rec.nickname).slice(0, 10);
      const label = '\uD83E\uDD47 ' + nick + '  ' + rec.score; // 🥇
      const tw = ctx.measureText(label).width;
      const bx=W/2-(tw/2+10), by=26, bw=tw+20, bh=22, br=4;
      ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.moveTo(bx+br,by);
      ctx.lineTo(bx+bw-br,by); ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+br);
      ctx.lineTo(bx+bw,by+bh-br); ctx.quadraticCurveTo(bx+bw,by+bh,bx+bw-br,by+bh);
      ctx.lineTo(bx+br,by+bh); ctx.quadraticCurveTo(bx,by+bh,bx,by+bh-br);
      ctx.lineTo(bx,by+br); ctx.quadraticCurveTo(bx,by,bx+br,by);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#f5a623';
      ctx.shadowColor='rgba(245,166,35,0.7)'; ctx.shadowBlur=8;
      ctx.fillText(label, W/2, 42);
      ctx.shadowBlur=0;
      ctx.restore();
    }

    // ── 하트 아이콘 (최대 maxLives개 표시, 우측)
    const maxShow=Math.min(this.maxLives,5);
    for(let i=0;i<maxShow;i++) this.drawHeart(ctx,W-14-i*22,12,8,i<this.lives?'#e94560':'#333');

    // ── 방패 아이콘
    for(let i=0;i<this.maxShields;i++) this.drawShieldIcon(ctx,W-12-i*20,38,7,i<this.shields?'#4aa3df':'#333');

    // ── 콤보
    if(this.comboTextTimer>0){
      ctx.save(); ctx.globalAlpha=Math.min(1,this.comboTextTimer/20); ctx.textAlign='center';
      ctx.font=`${14*(1+(1-this.comboTextTimer/60)*0.3)}px "Press Start 2P", monospace`;
      ctx.fillStyle='#f5a623'; ctx.fillText(this.comboText,W/2,H/2-60); ctx.restore();
    }

    // ── 스테이지 배너
    if(this.stageTextTimer>0){
      const a=this.stageTextTimer>70?(90-this.stageTextTimer)/20:this.stageTextTimer<20?this.stageTextTimer/20:1;
      ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center';
      ctx.font='22px "Press Start 2P", monospace'; ctx.fillStyle=c.color; ctx.fillText(this.stageText,W/2,H/2-20);
      if(this.stage>=1){ctx.font='9px "Press Start 2P", monospace'; ctx.fillStyle='#4aa3df'; ctx.fillText('방패 시스템 활성화!',W/2,H/2+10);}
      ctx.restore();
    }

    // ── 방패 알림
    if(this.shieldTextTimer>0){
      ctx.save(); ctx.globalAlpha=Math.min(1,this.shieldTextTimer/15); ctx.textAlign='center';
      ctx.font='10px "Press Start 2P", monospace'; ctx.fillStyle='#4aa3df';
      ctx.fillText(this.shieldText,W/2,H/2+40); ctx.restore();
    }

    // ── 황금 똥 / 하트 알림
    if(this.notifyTimer>0){
      const a=Math.min(1,this.notifyTimer/20);
      const yOff=this.notifyTimer>60?0:(60-this.notifyTimer)*0.6;
      ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center';
      ctx.font='11px "Press Start 2P", monospace'; ctx.fillStyle=this.notifyColor;
      ctx.shadowColor=this.notifyColor; ctx.shadowBlur=12;
      ctx.fillText(this.notifyText,W/2,H/2-80+yOff); ctx.restore();
    }

    // ── 일시정지 힌트 (하단 중앙)
    ctx.save();
    ctx.textAlign='center'; ctx.font='9px "Press Start 2P", monospace';
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.fillText('❙❙ P',W/2,H-10);
    ctx.restore();
  }

  drawHeart(ctx,x,y,s,color){
    ctx.save(); ctx.fillStyle=color; ctx.beginPath();
    ctx.moveTo(x,y+s*0.3);
    ctx.bezierCurveTo(x,y-s*0.3,x-s,y-s*0.3,x-s,y+s*0.1);
    ctx.bezierCurveTo(x-s,y+s*0.6,x,y+s,x,y+s*1.2);
    ctx.bezierCurveTo(x,y+s,x+s,y+s*0.6,x+s,y+s*0.1);
    ctx.bezierCurveTo(x+s,y-s*0.3,x,y-s*0.3,x,y+s*0.3);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  drawShieldIcon(ctx,x,y,s,color){
    ctx.save(); ctx.fillStyle=color; ctx.beginPath();
    ctx.moveTo(x,y-s); ctx.lineTo(x-s*0.8,y-s*0.5); ctx.lineTo(x-s*0.8,y+s*0.2);
    ctx.quadraticCurveTo(x,y+s,x,y+s); ctx.quadraticCurveTo(x,y+s,x+s*0.8,y+s*0.2);
    ctx.lineTo(x+s*0.8,y-s*0.5); ctx.closePath(); ctx.fill(); ctx.restore();
  }
}

// ============================================================
// INPUT
// ============================================================
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();

  // Enter 키: 게임 중이면 일시정지, 오버레이/버튼에 포커스 가더라도 차단
  if(e.code==='Enter'){
    e.preventDefault();
    if(game && !game.gameOver) togglePause();
    return;
  }

  // 일시정지 토글 (ESC 또는 P)
  if(e.code==='Escape'||e.code==='KeyP'){
    e.preventDefault();
    togglePause();
    return;
  }
  if(game&&!game.gameOver&&!paused){
    if(e.code==='ArrowLeft'||e.code==='KeyA')game.keys.left=true;
    if(e.code==='ArrowRight'||e.code==='KeyD')game.keys.right=true;
    if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space')game.keys.up=true;
  }
});
document.addEventListener('keyup',e=>{
  if(game){
    if(e.code==='ArrowLeft'||e.code==='KeyA')game.keys.left=false;
    if(e.code==='ArrowRight'||e.code==='KeyD')game.keys.right=false;
    if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space')game.keys.up=false;
  }
});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  // 일시정지 중이면 탭으로 재개
  if(paused){ togglePause(); return; }
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  const tx=t.clientX-r.left,ty=t.clientY-r.top;
  if(game&&!game.gameOver&&!paused){
    if(ty<r.height*0.5)game.keys.up=true;
    if(tx<r.width/2){game.keys.left=true;game.keys.right=false;}
    else{game.keys.right=true;game.keys.left=false;}
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(game){game.keys.left=false;game.keys.right=false;game.keys.up=false;}
},{passive:false});

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(){
  if(!game)return;
  if(!paused){ game.update(); game.draw(); }
  animFrameId=requestAnimationFrame(gameLoop);
}
function startGame(){
  overlay.classList.add('hidden');
  pausePanel.classList.remove('visible');
  paused=false;
  game=new Game();
  if(animFrameId)cancelAnimationFrame(animFrameId);
  gameLoop();
  // 버튼에 포커스가 남아있으면 Enter/Space가 버튼을 다시 클릭하므로 즉시 해제
  if(document.activeElement) document.activeElement.blur();
}

// ============================================================
// GAME OVER
// ============================================================
function showGameOver(reachedStage,finalScore){
  overlay.classList.remove('hidden');
  overlay.innerHTML=`
    <div class="poop-title">💀</div>
    <div id="gameOverText">GAME OVER</div>
    <div id="finalScore">SCORE: ${finalScore}</div>
    <div style="color:#aaa;font-size:11px;margin-bottom:4px;font-family:'Press Start 2P',monospace;">STAGE ${reachedStage} 도달</div>
    <div id="highScoreText">🏆 BEST: ${highScore}</div>
    <div id="nicknameSection">
      <div id="nicknameLabel">🏆 명예의 전당 등록</div>
      <div id="nicknameInputRow">
        <input id="nicknameInput" type="text" maxlength="10" placeholder="닉네임 입력" autocomplete="off" spellcheck="false">
        <button class="btn" id="submitScoreBtn">등록</button>
      </div>
      <div id="submitMsg"></div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="startGame()">RETRY</button>
      <button class="btn secondary" id="goLbBtn">🏆 랭킹 보기</button>
    </div>
    <div class="controls-hint">← → 방향키 또는 터치로 이동<br>↑ 또는 스페이스바로 점프</div>
  `;
  const submitBtn=document.getElementById('submitScoreBtn');
  const submitMsg=document.getElementById('submitMsg');
  const nicknameInput=document.getElementById('nicknameInput');
  let submitted=false;
  async function doSubmit(){
    if(submitted)return;
    const nick=nicknameInput.value.trim();
    if(!nick){submitMsg.style.color='#e94560';submitMsg.textContent='닉네임을 입력해주세요!';return;}
    submitBtn.disabled=true; submitMsg.style.color='#aaa'; submitMsg.textContent='저장 중...';
    try {
      await insertScore(nick,finalScore,reachedStage);
      submitted=true; submitMsg.style.color='#2ecc71'; submitMsg.textContent='✓ 등록 완료!';
      submitBtn.textContent='✓ 완료';
      setTimeout(()=>openLeaderboard({nickname:nick,score:finalScore}),800);
    } catch(e){
      submitBtn.disabled=false; submitMsg.style.color='#e94560';
      submitMsg.textContent='⚠ 저장 실패. 다시 시도해주세요.'; console.error(e);
    }
  }
  submitBtn.addEventListener('click',doSubmit);
  nicknameInput.addEventListener('keydown',e=>{if(e.key==='Enter')doSubmit();});
  document.getElementById('goLbBtn').addEventListener('click',()=>openLeaderboard(null));
}

// ============================================================
// INIT — 1위 기록 미리 로드
// ============================================================
startBtn.addEventListener('click',startGame);
document.getElementById('showLbBtn').addEventListener('click',()=>openLeaderboard(null));
document.getElementById('pauseBtn').addEventListener('click',togglePause);

// 페이지 로드 시 1위 기록 비동기 로드
(async()=>{
  try {
    const rows=await fetchLeaderboard();
    if(rows&&rows[0]){
      topRecord={nickname:rows[0].nickname,score:rows[0].score};
      if(game) game.topRecord=topRecord; // 이미 게임 중이면 즉시 반영
    }
  } catch(e){console.warn('1위 기록 로드 실패',e);}
})();
</script>
